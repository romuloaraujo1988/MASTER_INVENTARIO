version: '3.8'

services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:14
    container_name: inventario-postgres
    environment:
      POSTGRES_DB: sispatrimonio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Romulo@2020
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - inventario-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache Redis (para múltiplas instâncias)
  redis:
    image: redis:7-alpine
    container_name: inventario-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - inventario-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  # Aplicação Mobile API (pode escalar com --scale)
  mobile-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: mobile,production
      DATABASE_URL: jdbc:postgresql://postgres:5432/sispatrimonio
      DATABASE_USER: postgres
      DATABASE_PASSWORD: Romulo@2020
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-inventario-mobile-secret-key-2024-very-long-secret-for-security-must-be-at-least-256-bits}
      SERVER_PORT: 8081
      JAVA_OPTS: -Xms1g -Xmx2g -XX:+UseG1GC
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inventario-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/inventario/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 3  # 3 instâncias por padrão
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Load Balancer Nginx
  nginx:
    image: nginx:alpine
    container_name: inventario-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mobile-api
    networks:
      - inventario-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Prometheus (monitoramento)
  prometheus:
    image: prom/prometheus:latest
    container_name: inventario-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - inventario-network

  # Grafana (visualização)
  grafana:
    image: grafana/grafana:latest
    container_name: inventario-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - inventario-network

networks:
  inventario-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
