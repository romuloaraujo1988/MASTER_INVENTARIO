# ===== CONFIGURAÇÃO DE PRODUÇÃO ESCALÁVEL =====
# Este arquivo deve ser usado em ambiente de produção
# Ativar com: java -jar app.jar --spring.profiles.active=mobile,production

# Porta do servidor (pode ser sobrescrita por variável de ambiente)
server.port=${SERVER_PORT:8081}

# ===== POOL DE CONEXÕES OTIMIZADO PARA PRODUÇÃO =====
# Ajustar conforme número de instâncias e capacidade do banco
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:15}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ===== THREAD POOL OTIMIZADO =====
# Ajustar conforme CPU disponível (regra: 200 threads por core)
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:400}
server.tomcat.threads.min-spare=${TOMCAT_MIN_THREADS:50}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:20000}
server.tomcat.accept-count=200

# ===== LOGGING OTIMIZADO PARA PRODUÇÃO =====
logging.level.root=WARN
logging.level.com.inventario=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Logs estruturados (JSON) para ferramentas de análise
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/inventario-mobile-production.log
logging.file.max-size=10MB
logging.file.max-history=30

# ===== CACHE DISTRIBUÍDO (preparado para Redis) =====
# Descomentar quando configurar Redis para cache distribuído
# spring.cache.type=redis
# spring.redis.host=${REDIS_HOST:localhost}
# spring.redis.port=${REDIS_PORT:6379}
# spring.redis.password=${REDIS_PASSWORD:}
# spring.redis.timeout=2000ms
# spring.redis.lettuce.pool.max-active=20
# spring.redis.lettuce.pool.max-idle=10
# spring.redis.lettuce.pool.min-idle=5

# ===== SEGURANÇA REFORÇADA =====
# JWT secret deve vir de variável de ambiente
jwt.secret=${JWT_SECRET:inventario-mobile-secret-key-2024-very-long-secret-for-security-must-be-at-least-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400}

# CORS restrito em produção
api.mobile.cors.allowed-origins=${CORS_ORIGINS:https://app.inventario.ifmt.edu.br}

# Rate limiting mais rigoroso
api.mobile.rate-limit.enabled=true
api.mobile.rate-limit.requests-per-minute=${RATE_LIMIT:200}

# ===== COMPRESSÃO MÁXIMA =====
server.compression.enabled=true
server.compression.level=9

# ===== MONITORAMENTO =====
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# ===== BANCO DE DADOS =====
# Usar variáveis de ambiente para credenciais
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sispatrimonio}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Romulo@2020}

# ===== RESILIÊNCIA =====
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s
