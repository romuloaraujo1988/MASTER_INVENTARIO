# =====================================================
# Configuração OTIMIZADA para API Mobile - v4.0
# OTIMIZADO PARA ~30 USUÁRIOS COM MELHOR DESEMPENHO
# =====================================================
# Requisitos de Hardware Recomendados:
# - CPU: 4 cores (mínimo 2)
# - RAM: 4GB disponível para JVM (mínimo 2GB)
# - Disco: SSD recomendado
# =====================================================

server.port=8081
server.address=0.0.0.0
server.servlet.context-path=/inventario

# ===== COMPRESSÃO GZIP (PERFORMANCE) =====
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=512

# ===== LOGGING OTIMIZADO =====
logging.level.root=WARN
logging.level.com.inventario=INFO
logging.level.com.inventario.mobile.server.controller=INFO
logging.level.com.inventario.mobile.server.service=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN

# Desabilitar logs verbosos
logging.level.org.springframework.boot.autoconfigure=ERROR
logging.level.org.apache.tomcat=WARN
logging.level.org.apache.catalina=WARN

# Arquivo de log com rotação
logging.file.name=logs/mobile-server.log
logging.file.max-size=10MB
logging.file.max-history=5
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===== JWT =====
jwt.secret=inventario-mobile-secret-key-2024-very-long-secret-for-security-must-be-at-least-256-bits
jwt.expiration=86400
jwt.refresh-expiration=604800

# ===== API Mobile =====
api.mobile.version=v1
api.mobile.base-path=/api/mobile
api.mobile.cors.allowed-origins=*
api.mobile.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
api.mobile.cors.allowed-headers=*
api.mobile.cors.allow-credentials=true
api.mobile.rate-limit.enabled=false

# ===== Servidor Mobile =====
mobile.server.version=4.0.0
mobile.server.enabled=true
mobile.server.session-timeout=1800000

# ===== Upload de Arquivos =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ===== Banco de Dados =====
spring.datasource.url=jdbc:postgresql://localhost:5432/sispatrimonio
spring.datasource.username=postgres
spring.datasource.password=Romulo@2020
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== HikariCP OTIMIZADO PARA 30 USUÁRIOS =====
# Fórmula: connections = (core_count * 2) + effective_spindle_count
# Para 4 cores + SSD: (4 * 2) + 1 = 9, arredondamos para 10-15
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=MobileHikariCP
spring.datasource.hikari.leak-detection-threshold=120000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# Propriedades de performance do PostgreSQL
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# ===== Tomcat OTIMIZADO PARA 30 USUÁRIOS =====
# Threads: 30 usuários * 2 requisições simultâneas = 60 threads max
server.tomcat.threads.max=60
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=200
server.tomcat.accept-count=50
server.tomcat.connection-timeout=20000
server.tomcat.keep-alive-timeout=30000
server.tomcat.max-keep-alive-requests=100

# Buffer de resposta otimizado
server.tomcat.max-http-form-post-size=5MB
server.tomcat.max-swallow-size=5MB

# ===== JPA OTIMIZADO PARA PERFORMANCE =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# CACHE DE SEGUNDO NÍVEL DESABILITADO (requer dependência JCache)
# Para habilitar, adicione ehcache ou caffeine no pom.xml
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
# spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory

# Batch otimizado para performance
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Fetch size otimizado
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# CRÍTICO: Desabilitar open-in-view (evita N+1 queries)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# Estatísticas (desabilitar em produção)
spring.jpa.properties.hibernate.generate_statistics=false

# ===== ACTUATOR PARA MONITORAMENTO =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.metrics.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true

# Métricas essenciais habilitadas
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.tomcat=true
management.metrics.enable.hikaricp=true

# ===== RESILIÊNCIA E TIMEOUT =====
spring.mvc.async.request-timeout=30000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ===== JACKSON (JSON) OTIMIZADO =====
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ===== CACHE HTTP (PERFORMANCE) =====
spring.web.resources.cache.cachecontrol.max-age=3600
spring.web.resources.cache.cachecontrol.cache-public=true

# ===== INFO =====
info.app.name=Sistema de Inventário - API Mobile
info.app.version=4.0.0
info.app.description=API REST Mobile (Otimizada para 30 usuários)
