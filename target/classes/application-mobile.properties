# =====================================================
# Configuração API Mobile - v5.0 (ESTABILIDADE)
# PRIORIDADE: INTEGRIDADE DOS DADOS DE COLETA
# =====================================================
# Foco: Estabilidade > Performance
# - Transações seguras com rollback automático
# - Retry em falhas de conexão
# - Validação rigorosa de dados
# - Logs de auditoria para coletas
# =====================================================

server.port=8081
server.address=0.0.0.0
server.servlet.context-path=/inventario

# ===== COMPRESSÃO GZIP (PERFORMANCE) =====
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=512

# ===== LOGGING MÍNIMO (APENAS ERROS CRÍTICOS) =====
# OTIMIZAÇÃO MÁXIMA: Apenas ERROR para eliminar sobrecarga de I/O
logging.level.root=ERROR
logging.level.com.inventario=ERROR
logging.level.com.inventario.mobile.server.controller=ERROR
logging.level.com.inventario.mobile.server.service=ERROR

# Manter INFO APENAS para coletas (auditoria obrigatória - compliance)
logging.level.com.inventario.mobile.server.controller.MobileColetaController=INFO

# Frameworks - Apenas erros fatais
logging.level.org.springframework=ERROR
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.boot=ERROR
logging.level.org.springframework.transaction=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.apache.tomcat=ERROR
logging.level.org.apache.catalina=ERROR

# Arquivo de log MÍNIMO (5MB x 3 dias = 15MB total)
logging.file.name=logs/mobile-server.log
logging.file.max-size=5MB
logging.file.max-history=3
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ===== JWT =====
jwt.secret=inventario-mobile-secret-key-2024-very-long-secret-for-security-must-be-at-least-256-bits
jwt.expiration=86400
jwt.refresh-expiration=604800

# ===== API Mobile =====
api.mobile.version=v1
api.mobile.base-path=/api/mobile
api.mobile.cors.allowed-origins=*
api.mobile.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
api.mobile.cors.allowed-headers=*
api.mobile.cors.allow-credentials=true
api.mobile.rate-limit.enabled=false

# ===== Servidor Mobile =====
mobile.server.version=4.0.0
mobile.server.enabled=true
mobile.server.session-timeout=1800000

# ===== Upload de Arquivos =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ===== Banco de Dados =====
spring.datasource.url=jdbc:postgresql://localhost:5432/sispatrimonio
spring.datasource.username=postgres
spring.datasource.password=Romulo@2020
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== HikariCP OTIMIZADO PARA DISPOSITIVOS MÓVEIS =====
# Adequado para 5-10 dispositivos móveis simultâneos
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.pool-name=MobileHikariCP

# TIMEOUTS AJUSTADOS PARA ESTABILIDADE
# connection-timeout: tempo para obter conexão do pool (AUMENTADO para 30s)
spring.datasource.hikari.connection-timeout=30000

# idle-timeout: tempo que conexão ociosa fica no pool (5 min)
spring.datasource.hikari.idle-timeout=300000

# max-lifetime: vida máxima de uma conexão (15 min)
# Deve ser menor que wait_timeout do PostgreSQL (padrão 8h)
spring.datasource.hikari.max-lifetime=900000

# leak-detection: detecta conexões não fechadas (60s)
spring.datasource.hikari.leak-detection-threshold=60000

# validation-timeout: tempo para validar conexão (10s)
spring.datasource.hikari.validation-timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1

# Auto-commit habilitado (Spring gerencia transações via @Transactional)
spring.datasource.hikari.auto-commit=true

# Retry em caso de falha de conexão
spring.datasource.hikari.initialization-fail-timeout=30000

# keepalive-time: envia ping para manter conexão viva (2 min)
# Evita que firewall/NAT feche conexões ociosas
spring.datasource.hikari.keepalive-time=120000

# Propriedades do PostgreSQL
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.data-source-properties.socketTimeout=30

# ===== Tomcat OTIMIZADO PARA DISPOSITIVOS MÓVEIS =====
# Adequado para 5-10 dispositivos móveis simultâneos
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=50
server.tomcat.accept-count=10

# TIMEOUTS AJUSTADOS PARA REDES MÓVEIS (WiFi/4G instáveis)
# connection-timeout: tempo para estabelecer conexão TCP
server.tomcat.connection-timeout=60000

# keep-alive-timeout: tempo que conexão fica aberta aguardando próxima requisição
# AUMENTADO: 5 minutos (300s) para evitar reconexões frequentes
server.tomcat.keep-alive-timeout=300000

# max-keep-alive-requests: máximo de requisições por conexão keep-alive
# AUMENTADO: 200 requisições antes de forçar nova conexão
server.tomcat.max-keep-alive-requests=200

# Buffer de resposta
server.tomcat.max-http-form-post-size=5MB
server.tomcat.max-swallow-size=5MB

# Accesslog DESABILITADO para economizar I/O de disco
# MUDANÇA: Desabilitado (economiza ~30% de I/O)
server.tomcat.accesslog.enabled=false

# ===== JPA CONFIGURADO PARA INTEGRIDADE DE DADOS =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Cache desabilitado para garantir dados sempre atualizados
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Batch para operações em lote (coletas)
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Fetch size conservador
spring.jpa.properties.hibernate.jdbc.fetch_size=30

# CRÍTICO: Desabilitar open-in-view
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# Estatísticas desabilitadas
spring.jpa.properties.hibernate.generate_statistics=false

# CRÍTICO: Configurações de transação para integridade
spring.jpa.properties.hibernate.connection.isolation=2
spring.jpa.properties.hibernate.connection.autocommit=false

# ===== ACTUATOR PARA MONITORAMENTO =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.metrics.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true

# Métricas essenciais habilitadas
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.tomcat=true
management.metrics.enable.hikaricp=true

# ===== RESILIÊNCIA PARA REDES MÓVEIS =====
# Request timeout: 60s (coleta ~10s + margem para rede instável)
spring.mvc.async.request-timeout=60000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Timeout de transação: 60s (margem para operações lentas)
spring.transaction.default-timeout=60

# ===== JACKSON (JSON) =====
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== CACHE HTTP =====
spring.web.resources.cache.cachecontrol.max-age=60
spring.web.resources.cache.cachecontrol.cache-public=true

# ===== TRANSAÇÕES =====
# Timeout: 30s (coleta individual ~10s + margem de segurança)
spring.transaction.default-timeout=30

# ===== VALIDAÇÃO =====
spring.mvc.throw-exception-if-no-handler-found=true

# ===== INFO =====
info.app.name=Sistema de Inventário - API Mobile
info.app.version=5.0.0
info.app.description=API REST Mobile (Prioridade: Estabilidade e Integridade de Dados)
info.app.stability-mode=true
