# Configuração temporária para teste da API Mobile com PostgreSQL
server.port=8081
server.address=0.0.0.0
server.servlet.context-path=/inventario

# Configuração para garantir que seja reconhecida como aplicação web
spring.main.web-application-type=servlet

# Configuração de banco PostgreSQL para teste
spring.datasource.url=jdbc:postgresql://localhost:5432/sispatrimonio
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=Romulo@2020

# JPA Configuration para PostgreSQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuração de CORS para permitir acesso mobile
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Configuração de logging
logging.level.com.inventario.controller.mobile=DEBUG
logging.level.org.springframework.web=INFO

# Configuração de segurança JWT
jwt.secret=inventario-mobile-secret-key-2024-very-long-secret-for-security-must-be-at-least-256-bits
jwt.expiration=86400
jwt.refresh-expiration=604800

# Configurações da API Mobile
api.mobile.version=v1
api.mobile.base-path=/api/mobile
api.mobile.cors.allowed-origins=*
api.mobile.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
api.mobile.cors.allowed-headers=*
api.mobile.cors.allow-credentials=true

# Configurações do servidor mobile
mobile.server.version=1.0.0
mobile.server.enabled=true
mobile.server.session-timeout=3600000

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always