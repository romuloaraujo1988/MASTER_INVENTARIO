<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot - SIHCP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .chat-header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .chat-header p {
            opacity: 0.8;
            font-size: 0.9em;
        }

        .status-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 12px;
            height: 12px;
            background: #27ae60;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .legal-docs-button {
            position: absolute;
            top: 15px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legal-docs-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message.bot .message-content {
            background: #e3f2fd;
            color: #1565c0;
            border-bottom-left-radius: 4px;
        }

        .message.user .message-content {
            background: #2196f3;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-size: 0.7em;
            opacity: 0.6;
            margin-top: 4px;
        }

        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: #e3f2fd;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            max-width: 70%;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #1565c0;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            border-color: #2196f3;
        }

        .send-button {
            width: 50px;
            height: 50px;
            background: #2196f3;
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .send-button:hover {
            background: #1976d2;
        }

        .send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .suggestions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .suggestion-chip {
            padding: 6px 12px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .suggestion-chip:hover {
            background: #2196f3;
            color: white;
            border-color: #2196f3;
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .welcome-message h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #c62828;
        }

        @media (max-width: 768px) {
            .chat-container {
                width: 95%;
                height: 95vh;
                border-radius: 10px;
            }
            
            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <button class="legal-docs-button" onclick="openLegalDocsPanel()">
                📚 Documentos Legais
            </button>
            <div class="status-indicator" id="statusIndicator"></div>
            <h1>🤖 Assistente Virtual IFMT</h1>
            <p>Sistema de Inventário - Chatbot Inteligente</p>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <h3>👋 Olá! Como posso ajudá-lo hoje?</h3>
                <p>Faça perguntas sobre patrimônios, setores, relatórios e muito mais!</p>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        
        <div class="chat-input">
            <div class="suggestions" id="suggestions">
                <div class="suggestion-chip" onclick="sendSuggestion('Quantos patrimônios temos no total?')">📊 Total de patrimônios</div>
                <div class="suggestion-chip" onclick="sendSuggestion('Mostre os computadores cadastrados')">💻 Computadores</div>
                <div class="suggestion-chip" onclick="sendSuggestion('Patrimônios por setor')">🏢 Por setor</div>
                <div class="suggestion-chip" onclick="sendSuggestion('Relatório de inventário')">📋 Relatórios</div>
                <div class="suggestion-chip" onclick="sendSuggestion('O que diz a lei sobre patrimônio público?')">📚 Consulta Legal</div>
            </div>
            
            <div class="input-container">
                <input type="text" class="input-field" id="messageInput" 
                       placeholder="Digite sua pergunta..." 
                       onkeypress="handleKeyPress(event)">
                <button class="send-button" id="sendButton" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let isWaitingResponse = false;
        let conversationHistory = [];
        let lastResponse = null;
        let currentUserId = 'user_' + Math.random().toString(36).substr(2, 9);

        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            checkServerStatus();
            focusInput();
            loadConversationHistory();
            loadSuggestions();
        });

        function focusInput() {
            document.getElementById('messageInput').focus();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function sendSuggestion(text) {
            document.getElementById('messageInput').value = text;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || isWaitingResponse) return;
            
            // Adicionar mensagem do usuário
            addMessage(message, 'user');
            input.value = '';
            
            // Mostrar indicador de digitação
            showTypingIndicator();
            isWaitingResponse = true;
            updateSendButton();
            
            try {
                const response = await fetch('/api/chatbot/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        userId: currentUserId,
                        sessionId: getSessionId()
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`Erro ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                // Simular delay de digitação
                setTimeout(() => {
                    hideTypingIndicator();
                    
                    lastResponse = {
                        originalQuery: message,
                        aiResponse: data.response,
                        intent: data.intent,
                        confidence: data.confidence,
                        timestamp: new Date()
                    };
                    
                    addEnhancedMessage(data, 'bot');
                    
                    // Atualizar histórico local
                    conversationHistory.push({
                        user: message,
                        bot: data.response,
                        timestamp: new Date(),
                        intent: data.intent
                    });
                    
                    // Carregar novas sugestões
                    loadSuggestions();
                    
                    isWaitingResponse = false;
                    updateSendButton();
                    focusInput();
                }, 1000);
                
            } catch (error) {
                console.error('Erro ao enviar mensagem:', error);
                hideTypingIndicator();
                addErrorMessage('Erro de conexão. Verifique se o servidor está rodando.');
                isWaitingResponse = false;
                updateSendButton();
                focusInput();
            }
        }

        function addMessage(text, sender) {
            const messagesContainer = document.getElementById('chatMessages');
            const welcomeMessage = messagesContainer.querySelector('.welcome-message');
            
            if (welcomeMessage) {
                welcomeMessage.remove();
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const now = new Date();
            const timeString = now.toLocaleTimeString('pt-BR', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            messageDiv.innerHTML = `
                <div class="message-content">
                    ${formatMessage(text)}
                    <div class="message-time">${timeString}</div>
                </div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
            
            // Adicionar ao histórico
            conversationHistory.push({ text, sender, time: timeString });
        }

        function addEnhancedMessage(data, sender) {
            const messagesContainer = document.getElementById('chatMessages');
            const welcomeMessage = messagesContainer.querySelector('.welcome-message');
            
            if (welcomeMessage) {
                welcomeMessage.remove();
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const now = new Date();
            const timeString = now.toLocaleTimeString('pt-BR', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            const confidenceColor = data.confidence > 0.8 ? '#27ae60' : data.confidence > 0.6 ? '#f39c12' : '#e74c3c';
            
            messageDiv.innerHTML = `
                <div class="message-content">
                    ${formatMessage(data.response)}
                    ${data.intent ? `<div style="font-size: 0.7em; color: #666; margin-top: 5px;">Intent: ${data.intent}</div>` : ''}
                    ${data.confidence ? `<div style="font-size: 0.7em; color: ${confidenceColor}; margin-top: 2px;">Confiança: ${Math.round(data.confidence * 100)}%</div>` : ''}
                    <div class="message-time">${timeString}</div>
                    <div class="feedback-buttons" style="margin-top: 8px;">
                        <button onclick="provideFeedback(true)" style="background: none; border: none; cursor: pointer; margin-right: 10px; font-size: 16px;" title="Resposta útil">👍</button>
                        <button onclick="provideFeedback(false)" style="background: none; border: none; cursor: pointer; font-size: 16px;" title="Resposta não útil">👎</button>
                    </div>
                </div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        async function provideFeedback(isPositive) {
            if (!lastResponse) return;
            
            try {
                await fetch('/api/chatbot/feedback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        userId: currentUserId,
                        sessionId: getSessionId(),
                        query: lastResponse.originalQuery,
                        response: lastResponse.aiResponse,
                        feedback: isPositive ? 'positive' : 'negative',
                        timestamp: lastResponse.timestamp
                    })
                });
                
                // Feedback visual
                const feedbackButtons = document.querySelectorAll('.feedback-buttons');
                const lastFeedback = feedbackButtons[feedbackButtons.length - 1];
                if (lastFeedback) {
                    lastFeedback.innerHTML = `<span style="color: #27ae60; font-size: 0.8em;">✓ Obrigado pelo feedback!</span>`;
                }
            } catch (error) {
                console.error('Erro ao enviar feedback:', error);
            }
        }

        async function loadConversationHistory() {
            try {
                const response = await fetch(`/api/chatbot/history?userId=${currentUserId}&sessionId=${getSessionId()}`);
                if (response.ok) {
                    const history = await response.json();
                    // Processar histórico se necessário
                }
            } catch (error) {
                console.error('Erro ao carregar histórico:', error);
            }
        }

        async function loadSuggestions() {
            try {
                const response = await fetch(`/api/chatbot/suggestions?userId=${currentUserId}&context=${encodeURIComponent(JSON.stringify(conversationHistory.slice(-3)))}`);
                if (response.ok) {
                    const data = await response.json();
                    updateSuggestionChips(data.suggestions || []);
                }
            } catch (error) {
                console.error('Erro ao carregar sugestões:', error);
            }
        }

        function updateSuggestionChips(suggestions) {
            const suggestionsContainer = document.getElementById('suggestions');
            if (suggestions.length > 0) {
                suggestionsContainer.innerHTML = suggestions.map(suggestion => 
                    `<div class="suggestion-chip" onclick="sendSuggestion('${suggestion.replace(/'/g, "\\'")}')">💡 ${suggestion}</div>`
                ).join('');
            }
        }

        function addErrorMessage(text) {
            const messagesContainer = document.getElementById('chatMessages');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = text;
            messagesContainer.appendChild(errorDiv);
            scrollToBottom();
        }

        function formatMessage(text) {
            // Formatação básica de texto
            return text
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>');
        }

        function showTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            indicator.style.display = 'block';
            scrollToBottom();
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            indicator.style.display = 'none';
        }

        function updateSendButton() {
            const button = document.getElementById('sendButton');
            button.disabled = isWaitingResponse;
        }

        function scrollToBottom() {
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function getSessionId() {
            let sessionId = localStorage.getItem('chatbot-session-id');
            if (!sessionId) {
                sessionId = 'session-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('chatbot-session-id', sessionId);
            }
            return sessionId;
        }

        async function checkServerStatus() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                
                const response = await fetch('/api/chatbot/ping', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const statusIndicator = document.getElementById('statusIndicator');
                
                if (response.ok) {
                    statusIndicator.style.background = '#27ae60';
                    statusIndicator.title = 'Servidor online';
                    // Limpar erros anteriores do console se o servidor estiver funcionando
                    console.log('✅ Servidor online e funcionando');
                } else {
                    statusIndicator.style.background = '#e74c3c';
                    statusIndicator.title = 'Servidor com problemas';
                    console.warn('⚠️ Servidor respondeu com status:', response.status);
                }
            } catch (error) {
                const statusIndicator = document.getElementById('statusIndicator');
                statusIndicator.style.background = '#e74c3c';
                statusIndicator.title = 'Servidor offline';
                // Só logar erro se não for um timeout ou abort
                if (error.name !== 'TimeoutError' && error.name !== 'AbortError') {
                    console.error('❌ Erro ao verificar status do servidor:', error.message);
                }
            }
        }

        // Função para abrir o painel de documentos legais
        function openLegalDocsPanel() {
            const panel = `
                <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; justify-content: center; align-items: center;" onclick="closeLegalDocsPanel(event)">
                    <div style="background: white; padding: 30px; border-radius: 15px; max-width: 600px; width: 90%; max-height: 80%; overflow-y: auto;" onclick="event.stopPropagation()">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h2 style="margin: 0; color: #2c3e50;">📚 Documentos Legais</h2>
                            <button onclick="closeLegalDocsPanel()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #666;">×</button>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <h3 style="color: #34495e; margin-bottom: 10px;">🔍 Buscar Documentos</h3>
                            <input type="text" id="legalSearchInput" placeholder="Digite termos para buscar..." style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 10px;">
                            <button onclick="searchLegalDocuments()" style="background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer;">Buscar</button>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <h3 style="color: #34495e; margin-bottom: 10px;">📄 Carregar Documento</h3>
                            <input type="file" id="legalFileInput" accept=".txt,.pdf,.doc,.docx" style="margin-bottom: 10px;">
                            <button onclick="uploadLegalDocument()" style="background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer;">Carregar</button>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <h3 style="color: #34495e; margin-bottom: 10px;">📊 Estatísticas</h3>
                            <button onclick="showLegalStats()" style="background: #9b59b6; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer;">Ver Estatísticas</button>
                        </div>
                        <div id="legalDocsResults" style="margin-top: 20px;"></div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', panel);
        }

        function closeLegalDocsPanel(event) {
            if (event && event.target !== event.currentTarget) return;
            const panel = document.querySelector('[style*="position: fixed"][style*="z-index: 1000"]');
            if (panel) panel.remove();
        }

        async function searchLegalDocuments() {
            const query = document.getElementById('legalSearchInput').value.trim();
            if (!query) {
                alert('Por favor, digite um termo para buscar.');
                return;
            }

            try {
                const response = await fetch('/api/legal-documents/search?query=' + encodeURIComponent(query));
                const data = await response.json();
                
                const resultsDiv = document.getElementById('legalDocsResults');
                if (data.results && data.results.length > 0) {
                    resultsDiv.innerHTML = '<h4>Resultados da Busca:</h4>' + 
                        data.results.map(result => `<div style="padding: 10px; border: 1px solid #ddd; margin: 5px 0; border-radius: 5px;"><strong>${result.title || 'Documento'}</strong><br>${result.content || result.summary || 'Conteúdo não disponível'}</div>`).join('');
                } else {
                    resultsDiv.innerHTML = '<p style="color: #666;">Nenhum resultado encontrado.</p>';
                }
            } catch (error) {
                console.error('Erro na busca:', error);
                document.getElementById('legalDocsResults').innerHTML = '<p style="color: #e74c3c;">Erro ao buscar documentos.</p>';
            }
        }

        async function uploadLegalDocument() {
            const fileInput = document.getElementById('legalFileInput');
            if (!fileInput.files[0]) {
                alert('Por favor, selecione um arquivo.');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/api/legal-documents/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                const resultsDiv = document.getElementById('legalDocsResults');
                if (data.success) {
                    resultsDiv.innerHTML = '<p style="color: #27ae60;">✅ Documento carregado com sucesso!</p>';
                    fileInput.value = '';
                } else {
                    resultsDiv.innerHTML = '<p style="color: #e74c3c;">❌ Erro ao carregar documento: ' + (data.message || 'Erro desconhecido') + '</p>';
                }
            } catch (error) {
                console.error('Erro no upload:', error);
                document.getElementById('legalDocsResults').innerHTML = '<p style="color: #e74c3c;">❌ Erro ao carregar documento.</p>';
            }
        }

        async function showLegalStats() {
            try {
                const response = await fetch('/api/legal-documents/statistics');
                const data = await response.json();
                
                const resultsDiv = document.getElementById('legalDocsResults');
                resultsDiv.innerHTML = `
                    <h4>📊 Estatísticas dos Documentos Legais</h4>
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                        <p><strong>Total de documentos:</strong> ${data.totalDocuments || 0}</p>
                        <p><strong>Documentos processados:</strong> ${data.processedDocuments || 0}</p>
                        <p><strong>Última atualização:</strong> ${data.lastUpdate || 'N/A'}</p>
                        <p><strong>Status do sistema:</strong> ${data.systemStatus || 'Ativo'}</p>
                    </div>
                `;
            } catch (error) {
                console.error('Erro ao obter estatísticas:', error);
                document.getElementById('legalDocsResults').innerHTML = '<p style="color: #e74c3c;">❌ Erro ao obter estatísticas.</p>';
            }
        }

        // Verificar status do servidor periodicamente (a cada 2 minutos para reduzir logs)
        setInterval(checkServerStatus, 120000);
    </script>
</body>
</html>
