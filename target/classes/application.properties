# Configurações da Aplicação Sistema de Inventário

# Informações da Aplicação
app.name=Sistema de Inventário
app.version=1.2.0
app.vendor=IFMT
app.description=Sistema de Controle de Inventário de Patrimônio

# Configurações de Interface
app.ui.lookAndFeel=system
app.ui.theme=default
app.ui.splash.enabled=true
app.ui.splash.duration=2000

# Configurações de Banco de Dados
app.database.config.file=configuracao_banco.json
app.database.connection.timeout=30000
app.database.connection.retry.attempts=3

# Configurações de Log
logging.file.name=logs/sistema-inventario.log
logging.file.max-size=10485760
logging.file.max-history=30

# Configurações de Modo Offline
app.offline.enabled=true
app.offline.database.file=data/inventario.db
app.offline.sync.interval=300000

# Configurações de IA


# Configurações específicas do Spring Boot
# Porta padrão (será sobrescrita pelo perfil mobile)
# COMENTADO: server.port=8080
spring.application.name=inventario-api
# Não definir perfil ativo aqui - será definido na linha de comando
# spring.profiles.active=mobile
spring.main.web-application-type=servlet
spring.main.allow-bean-definition-overriding=true

# Configurações de banco de dados para teste
# [REMOVIDO] Configuração de SQLite em memória movida para application-test.properties para evitar conflitos com o perfil 'mobile'
# spring.datasource.url=jdbc:sqlite::memory:
# spring.datasource.driver-class-name=org.sqlite.JDBC
# spring.jpa.database-platform=org.hibernate.dialect.SQLiteDialect
# spring.jpa.hibernate.ddl-auto=create-drop
# spring.jpa.show-sql=false

# Configurações de segurança simplificadas
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

# Configurações de logging (OTIMIZADO)
# NOTA: Para servidor mobile, use o perfil 'mobile' que tem logs mínimos
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.context=WARN
logging.level.org.springframework.beans=WARN
logging.level.org.springframework.security=WARN
logging.level.com.inventario=INFO
logging.level.root=WARN

# Configurações para manter a aplicação rodando
spring.main.keep-alive=true
spring.lifecycle.timeout-per-shutdown-phase=30s

# Configurações de Segurança
app.security.session.timeout=3600000
app.security.password.min.length=6
app.security.login.max.attempts=3

# Configurações de Performance
app.performance.cache.enabled=true
app.performance.cache.size=1000
app.performance.thread.pool.size=10

# Configurações de Backup
app.backup.enabled=true
app.backup.interval=86400000
app.backup.retention.days=30
app.backup.path=backup/

# Configurações de Sistema de Notificação (opcional)
app.notification.toast.enabled=true
app.notification.error-reporting.enabled=true
app.notification.toast.duration=4000
app.notification.error-reports.retention.days=30