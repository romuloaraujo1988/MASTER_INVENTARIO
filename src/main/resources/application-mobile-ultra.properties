# =====================================================
# Configuração ULTRA OTIMIZADA - Anti-Travamento
# Para servidores com recursos limitados
# =====================================================

server.port=8081
server.address=0.0.0.0
server.servlet.context-path=/inventario

# ===== COMPRESSÃO =====
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=512

# ===== LOGGING MÍNIMO ABSOLUTO =====
logging.level.root=ERROR
logging.level.com.inventario=WARN
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.apache=ERROR

# Desabilitar banner do Spring
spring.main.banner-mode=off

# Arquivo de log pequeno
logging.file.name=logs/mobile-server.log
logging.file.max-size=2MB
logging.file.max-history=2
logging.pattern.console=%d{HH:mm:ss} %msg%n

# ===== JWT =====
jwt.secret=inventario-mobile-secret-key-2024-very-long-secret-for-security-must-be-at-least-256-bits
jwt.expiration=86400
jwt.refresh-expiration=604800

# ===== BANCO DE DADOS =====
spring.datasource.url=jdbc:postgresql://localhost:5432/sispatrimonio
spring.datasource.username=postgres
spring.datasource.password=Romulo@2020
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== HikariCP ULTRA MÍNIMO =====
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=UltraHikariCP
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.validation-timeout=3000

# ===== TOMCAT ULTRA MÍNIMO =====
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=1
server.tomcat.max-connections=50
server.tomcat.accept-count=10
server.tomcat.connection-timeout=8000
server.tomcat.keep-alive-timeout=10000
server.tomcat.max-keep-alive-requests=20

# Desabilitar access log
server.tomcat.accesslog.enabled=false

# ===== JPA ULTRA OTIMIZADO =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# DESABILITAR TODOS OS CACHES
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.generate_statistics=false

# CRÍTICO: Desabilitar open-in-view
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# Batch mínimo
spring.jpa.properties.hibernate.jdbc.batch_size=3

# ===== DESABILITAR TUDO QUE NÃO É ESSENCIAL =====
spring.jmx.enabled=false
spring.main.lazy-initialization=true

# Desabilitar DevTools
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ===== ACTUATOR MÍNIMO =====
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Desabilitar todas as métricas
management.metrics.enable.all=false

# ===== TIMEOUTS AGRESSIVOS =====
spring.mvc.async.request-timeout=15000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s

# ===== JACKSON OTIMIZADO =====
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ===== UPLOAD MÍNIMO =====
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# ===== DESABILITAR FEATURES DESNECESSÁRIAS =====
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.admin.SpringApplicationAdminJmxAutoConfiguration,\
  org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration,\
  org.springframework.boot.autoconfigure.websocket.servlet.WebSocketServletAutoConfiguration,\
  org.springframework.boot.autoconfigure.task.TaskSchedulingAutoConfiguration
