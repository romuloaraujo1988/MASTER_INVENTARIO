# Configurações do Modo Offline
# Sistema de Inventário IFMT
# Versão 1.0.0

# ==================== CONFIGURAÇÕES GERAIS ====================

# Habilita o modo offline por padrão
offline.enabled=true

# Caminho do banco de dados SQLite local
offline.database.path=./data/inventario.db

# Timeout para operações de banco (em segundos)
offline.database.timeout=30

# ==================== CONECTIVIDADE ====================

# Intervalo de verificação de conectividade (em segundos)
connectivity.check.interval=30

# Timeout para teste de conectividade (em segundos)
connectivity.timeout=5

# URL para teste de conectividade (ping)
connectivity.test.url=http://www.google.com

# Número de tentativas de reconexão
connectivity.retry.attempts=3

# Intervalo entre tentativas de reconexão (em segundos)
connectivity.retry.interval=10

# ==================== SINCRONIZAÇÃO ====================

# Habilita sincronização automática
sync.auto.enabled=true

# Intervalo de sincronização automática (em minutos)
sync.interval.minutes=5

# Tamanho do lote para sincronização
sync.batch.size=50

# Timeout para operações de sincronização (em segundos)
sync.timeout=120

# Estratégia de resolução de conflitos
# Opções: TIMESTAMP_WINS, LOCAL_WINS, REMOTE_WINS, MANUAL_RESOLUTION
sync.conflict.resolution=TIMESTAMP_WINS

# Número máximo de tentativas de sincronização
sync.max.retries=3

# Intervalo entre tentativas de sincronização (em segundos)
sync.retry.interval=30

# ==================== ARMAZENAMENTO LOCAL ====================

# Tamanho máximo do cache local (em MB)
storage.cache.max.size=100

# Tempo de retenção de dados sincronizados (em dias)
storage.retention.days=30

# Habilita compressão de dados
storage.compression.enabled=true

# Habilita backup automático do banco local
storage.backup.enabled=true

# Intervalo de backup automático (em horas)
storage.backup.interval=24

# Número máximo de backups a manter
storage.backup.max.count=7

# ==================== PERFORMANCE ====================

# Tamanho do pool de threads para sincronização
performance.thread.pool.size=2

# Timeout para operações assíncronas (em segundos)
performance.async.timeout=60

# Habilita otimizações de performance
performance.optimizations.enabled=true

# Intervalo de limpeza automática (em horas)
performance.cleanup.interval=6

# ==================== LOGGING ====================

# Nível de log para modo offline
# Opções: SEVERE, WARNING, INFO, CONFIG, FINE, FINER, FINEST
logging.level=INFO

# Habilita log detalhado de sincronização
logging.sync.detailed=false

# Habilita log de operações de banco
logging.database.operations=false

# Tamanho máximo do arquivo de log (em MB)
logging.file.max.size=10

# Número máximo de arquivos de log
logging.file.max.count=5

# ==================== SEGURANÇA ====================

# Habilita criptografia do banco local
security.encryption.enabled=false

# Algoritmo de criptografia
security.encryption.algorithm=AES

# Tamanho da chave de criptografia
security.encryption.key.size=256

# Habilita verificação de integridade
security.integrity.check=true

# ==================== INTERFACE DO USUÁRIO ====================

# Mostra indicador de status offline na interface
ui.status.indicator.enabled=true

# Posição do indicador de status
# Opções: TOP_LEFT, TOP_RIGHT, BOTTOM_LEFT, BOTTOM_RIGHT
ui.status.indicator.position=TOP_RIGHT

# Mostra notificações de sincronização
ui.sync.notifications.enabled=true

# Duração das notificações (em segundos)
ui.notifications.duration=5

# Habilita modo escuro para telas offline
ui.dark.mode.enabled=false

# ==================== RECURSOS ESPECÍFICOS ====================

# Habilita coleta offline de patrimônios
features.patrimonio.offline.enabled=true

# Habilita criação offline de inventários
features.inventario.offline.enabled=true

# Habilita geração offline de relatórios
features.relatorios.offline.enabled=false

# Habilita backup de fotos offline
features.fotos.offline.enabled=true

# Tamanho máximo de foto (em KB)
features.fotos.max.size=500

# Qualidade de compressão de fotos (0-100)
features.fotos.compression.quality=80

# ==================== DESENVOLVIMENTO ====================

# Habilita modo de desenvolvimento
development.mode.enabled=false

# Habilita logs de debug
development.debug.logging=false

# Simula perda de conectividade para testes
development.simulate.offline=false

# Intervalo de simulação de offline (em segundos)
development.offline.simulation.interval=60

# ==================== CONFIGURAÇÕES AVANÇADAS ====================

# Habilita modo de recuperação automática
advanced.auto.recovery.enabled=true

# Timeout para modo de recuperação (em segundos)
advanced.recovery.timeout=300

# Habilita verificação de consistência automática
advanced.consistency.check.enabled=true

# Intervalo de verificação de consistência (em horas)
advanced.consistency.check.interval=12

# Habilita otimização automática do banco
advanced.database.auto.optimize=true

# Intervalo de otimização do banco (em horas)
advanced.database.optimize.interval=24

# ==================== LIMITES E QUOTAS ====================

# Número máximo de registros offline
limits.max.offline.records=10000

# Tamanho máximo do banco SQLite (em MB)
limits.database.max.size=500

# Número máximo de operações pendentes
limits.max.pending.operations=1000

# Tempo máximo offline antes de alerta (em horas)
limits.max.offline.time=24

# ==================== MONITORAMENTO ====================

# Habilita monitoramento de performance
monitoring.performance.enabled=true

# Intervalo de coleta de métricas (em segundos)
monitoring.metrics.interval=60

# Habilita alertas de sistema
monitoring.alerts.enabled=true

# Threshold de uso de memória para alerta (%)
monitoring.memory.threshold=80

# Threshold de uso de disco para alerta (%)
monitoring.disk.threshold=90

# ==================== CONFIGURAÇÕES DE REDE ====================

# Timeout de conexão HTTP (em segundos)
network.connection.timeout=10

# Timeout de leitura HTTP (em segundos)
network.read.timeout=30

# Número máximo de conexões simultâneas
network.max.connections=5

# Habilita retry automático para falhas de rede
network.auto.retry.enabled=true

# Intervalo base para backoff exponencial (em segundos)
network.backoff.base.interval=2

# Multiplicador para backoff exponencial
network.backoff.multiplier=2

# Máximo intervalo de backoff (em segundos)
network.backoff.max.interval=60