# Configuração da Solução de IA para Análise de Dados e Machine Learning
# Este arquivo contém as configurações principais para integração das bibliotecas de IA

# ========================================
# CONFIGURAÇÕES GERAIS DE IA
# ========================================

# Habilitar/desabilitar funcionalidades de IA
ai.enabled=true
ai.debug.enabled=false
ai.performance.monitoring=true

# Diretório para armazenar modelos treinados
ai.models.directory=./ai-models
ai.models.auto.cleanup=true
ai.models.max.age.days=30

# ========================================
# CONFIGURAÇÕES DO PYTHON WRAPPER
# ========================================

# Configurações de integração Python
ai.python.enabled=true
ai.python.executable=python
ai.python.timeout.seconds=300
ai.python.max.concurrent.processes=4

# Bibliotecas Python requeridas
ai.python.required.libraries=numpy,pandas,scikit-learn,matplotlib,seaborn
ai.python.optional.libraries=tensorflow,torch,xgboost,lightgbm

# Configurações de ambiente Python
ai.python.virtual.env.path=
ai.python.working.directory=./python-scripts
ai.python.auto.install.dependencies=false

# ========================================
# CONFIGURAÇÕES DO WEKA
# ========================================

# Configurações do motor de análise Weka
ai.weka.enabled=true
ai.weka.max.instances=10000
ai.weka.default.classifier=weka.classifiers.trees.RandomForest
ai.weka.cross.validation.folds=10

# Algoritmos Weka disponíveis
ai.weka.classifiers=weka.classifiers.trees.RandomForest,weka.classifiers.functions.SMO,weka.classifiers.bayes.NaiveBayes,weka.classifiers.trees.J48
ai.weka.clusterers=weka.clusterers.SimpleKMeans,weka.clusterers.EM,weka.clusterers.DBSCAN
ai.weka.filters=weka.filters.supervised.attribute.AttributeSelection,weka.filters.unsupervised.attribute.Normalize

# ========================================
# CONFIGURAÇÕES DO CACHE DE IA
# ========================================

# Configurações do sistema de cache
ai.cache.enabled=true
ai.cache.max.size.mb=512
ai.cache.ttl.hours=24
ai.cache.cleanup.interval.minutes=60

# Cache de resultados ML
ai.cache.ml.results.enabled=true
ai.cache.ml.results.max.entries=1000
ai.cache.ml.results.similarity.threshold=0.95

# Cache de modelos treinados
ai.cache.models.enabled=true
ai.cache.models.max.entries=50
ai.cache.models.preload.popular=true

# Cache de configurações otimizadas
ai.cache.configs.enabled=true
ai.cache.configs.max.entries=200
ai.cache.configs.auto.update=true

# ========================================
# CONFIGURAÇÕES DO PIPELINE ML
# ========================================

# Configurações do pipeline de otimização
ai.pipeline.enabled=true
ai.pipeline.max.concurrent.optimizations=2
ai.pipeline.default.timeout.minutes=30
ai.pipeline.auto.save.results=true

# Algoritmos disponíveis no pipeline
ai.pipeline.algorithms=weka,python,hybrid
ai.pipeline.default.algorithm=hybrid
ai.pipeline.enable.ensemble=true

# Configurações de otimização automática
ai.pipeline.automl.enabled=true
ai.pipeline.automl.max.iterations=50
ai.pipeline.automl.early.stopping=true
ai.pipeline.automl.patience=10

# Métricas de avaliação
ai.pipeline.metrics.classification=accuracy,precision,recall,f1-score,auc
ai.pipeline.metrics.regression=rmse,mae,r2,mape
ai.pipeline.metrics.clustering=silhouette,calinski-harabasz,davies-bouldin

# ========================================
# CONFIGURAÇÕES DE COMUNICAÇÃO JAVA-PYTHON
# ========================================

# Configurações da ponte Java-Python
ai.bridge.enabled=true
ai.bridge.communication.method=process
ai.bridge.socket.port=8765
ai.bridge.socket.timeout.seconds=30

# Configurações de processo
ai.bridge.process.max.memory.mb=2048
ai.bridge.process.working.directory=./python-bridge
ai.bridge.process.environment.variables=

# Configurações de retry e recuperação
ai.bridge.retry.max.attempts=3
ai.bridge.retry.delay.seconds=5
ai.bridge.auto.restart.on.failure=true

# ========================================
# CONFIGURAÇÕES DE PERFORMANCE
# ========================================

# Configurações de threading
ai.threading.core.pool.size=4
ai.threading.max.pool.size=8
ai.threading.queue.capacity=100
ai.threading.keep.alive.seconds=60

# Configurações de memória
ai.memory.max.heap.percentage=70
ai.memory.gc.optimization=true
ai.memory.monitoring.enabled=true

# Configurações de I/O
ai.io.buffer.size.kb=64
ai.io.async.enabled=true
ai.io.compression.enabled=true

# ========================================
# CONFIGURAÇÕES DE LOGGING
# ========================================

# Configurações de log específicas para IA
ai.logging.level=INFO
ai.logging.file.enabled=true
ai.logging.file.path=./logs/ai-system.log
ai.logging.file.max.size.mb=100
ai.logging.file.max.files=10

# Logs detalhados
ai.logging.performance.enabled=true
ai.logging.cache.operations=false
ai.logging.python.communication=false
ai.logging.model.training=true

# ========================================
# CONFIGURAÇÕES DE SEGURANÇA
# ========================================

# Configurações de segurança
ai.security.enabled=true
ai.security.validate.inputs=true
ai.security.sanitize.outputs=true
ai.security.max.execution.time.minutes=60

# Restrições de recursos
ai.security.max.file.size.mb=100
ai.security.allowed.file.extensions=.csv,.json,.txt,.arff
ai.security.blocked.commands=rm,del,format,shutdown

# ========================================
# CONFIGURAÇÕES DE DESENVOLVIMENTO
# ========================================

# Configurações para ambiente de desenvolvimento
ai.dev.mode=false
ai.dev.mock.python.calls=false
ai.dev.generate.test.data=false
ai.dev.profiling.enabled=false

# Configurações de debug
ai.debug.save.intermediate.results=false
ai.debug.verbose.logging=false
ai.debug.trace.execution=false

# ========================================
# CONFIGURAÇÕES DE PRODUÇÃO
# ========================================

# Configurações específicas para produção
ai.production.mode=true
ai.production.health.checks=true
ai.production.metrics.collection=true
ai.production.auto.scaling=false

# Configurações de monitoramento
ai.monitoring.enabled=true
ai.monitoring.interval.seconds=60
ai.monitoring.alerts.enabled=true
ai.monitoring.performance.thresholds.response.time.ms=5000
ai.monitoring.performance.thresholds.memory.usage.percentage=80
ai.monitoring.performance.thresholds.cpu.usage.percentage=75

# ========================================
# CONFIGURAÇÕES EXPERIMENTAIS
# ========================================

# Funcionalidades experimentais (usar com cuidado)
ai.experimental.enabled=false
ai.experimental.gpu.acceleration=false
ai.experimental.distributed.computing=false
ai.experimental.quantum.algorithms=false

# Configurações de pesquisa e desenvolvimento
ai.research.mode=false
ai.research.collect.metrics=false
ai.research.export.models=false

# ========================================
# CONFIGURAÇÕES DE INTEGRAÇÃO
# ========================================

# Integração com Spring Boot
spring.ai.auto.configuration=true
spring.ai.web.endpoints.enabled=true
spring.ai.actuator.endpoints.enabled=true

# Integração com banco de dados
ai.database.store.results=true
ai.database.store.models=false
ai.database.cleanup.old.data=true
ai.database.connection.pool.size=5

# Integração com APIs externas
ai.external.apis.enabled=false
ai.external.apis.timeout.seconds=30
ai.external.apis.retry.attempts=3

# ========================================
# CONFIGURAÇÕES PERSONALIZADAS
# ========================================

# Adicione aqui configurações específicas do seu projeto
