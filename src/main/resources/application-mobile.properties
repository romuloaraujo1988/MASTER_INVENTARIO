# =====================================================
# Configuração OTIMIZADA para API Mobile - v3.0
# OTIMIZADO PARA ~15 USUÁRIOS E BAIXO CONSUMO DE MEMÓRIA
# =====================================================

server.port=8081
server.address=0.0.0.0
server.servlet.context-path=/inventario

# ===== COMPRESSÃO GZIP =====
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# ===== LOGGING MÍNIMO (CRÍTICO PARA MEMÓRIA) =====
# IMPORTANTE: Logs excessivos consomem MUITA memória
logging.level.root=WARN
logging.level.com.inventario=WARN
logging.level.com.inventario.mobile.server.controller=WARN
logging.level.com.inventario.mobile.server.service=WARN
logging.level.org.springframework=ERROR
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.boot=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.com.zaxxer.hikari=ERROR

# Desabilitar logs de debug completamente
logging.level.org.springframework.boot.autoconfigure=ERROR
logging.level.org.apache.tomcat=ERROR
logging.level.org.apache.catalina=ERROR

# Arquivo de log com rotação
logging.file.name=logs/mobile-server.log
logging.file.max-size=5MB
logging.file.max-history=3
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{20} - %msg%n

# ===== JWT =====
jwt.secret=inventario-mobile-secret-key-2024-very-long-secret-for-security-must-be-at-least-256-bits
jwt.expiration=86400
jwt.refresh-expiration=604800

# ===== API Mobile =====
api.mobile.version=v1
api.mobile.base-path=/api/mobile
api.mobile.cors.allowed-origins=*
api.mobile.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
api.mobile.cors.allowed-headers=*
api.mobile.cors.allow-credentials=true
api.mobile.rate-limit.enabled=false

# ===== Servidor Mobile =====
mobile.server.version=3.0.0
mobile.server.enabled=true
mobile.server.session-timeout=1800000

# ===== Upload de Arquivos (REDUZIDO) =====
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.enabled=true

# ===== Banco de Dados =====
spring.datasource.url=jdbc:postgresql://localhost:5432/sispatrimonio
spring.datasource.username=postgres
spring.datasource.password=Romulo@2020
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== HikariCP OTIMIZADO PARA 15 USUÁRIOS =====
# Pool MÍNIMO para economizar memória
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.pool-name=MobileHikariCP
spring.datasource.hikari.leak-detection-threshold=60000

# ===== Tomcat OTIMIZADO PARA 15 USUÁRIOS =====
# Threads MÍNIMAS para economizar memória
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100
server.tomcat.accept-count=20
server.tomcat.connection-timeout=10000
server.tomcat.keep-alive-timeout=15000
server.tomcat.max-keep-alive-requests=30

# ===== JPA OTIMIZADO =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# DESABILITAR CACHES DO HIBERNATE (economiza memória)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Batch pequeno para economizar memória
spring.jpa.properties.hibernate.jdbc.batch_size=5
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# CRÍTICO: Desabilitar open-in-view (economiza MUITA memória)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# ===== ACTUATOR MÍNIMO (DESABILITAR MÉTRICAS) =====
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.metrics.enabled=false
management.endpoint.prometheus.enabled=false
management.health.redis.enabled=false
management.health.db.enabled=false
management.health.diskspace.enabled=false

# DESABILITAR TODAS AS MÉTRICAS (economiza memória)
management.metrics.enable.all=false
management.metrics.enable.jvm=false
management.metrics.enable.process=false
management.metrics.enable.system=false
management.metrics.enable.tomcat=false
management.metrics.enable.hikaricp=false

# ===== RESILIÊNCIA =====
spring.mvc.async.request-timeout=20000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# ===== JACKSON (JSON) OTIMIZADO =====
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ===== INFO =====
info.app.name=Sistema de Inventário - API Mobile
info.app.version=3.0.0
info.app.description=API REST Mobile (Otimizada para baixa memória)
