# Configuração para API Mobile do Sistema de Inventário
# IMPORTANTE: Esta porta DEVE ser 8081 para o servidor mobile
server.port=8081
server.address=0.0.0.0
server.servlet.context-path=/inventario

# ===== COMPRESSÃO GZIP =====
# Habilitar compressão de respostas HTTP para reduzir tráfego de rede
server.compression.enabled=true

# Tipos MIME que serão comprimidos (JSON, XML, HTML, CSS, JS)
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css

# Tamanho mínimo para comprimir (1 KB)
# Respostas menores que isso não serão comprimidas para evitar overhead
server.compression.min-response-size=1024

# Nível de compressão (1-9, onde 9 é máximo)
# Recomendado: 6 (bom balanço entre compressão e uso de CPU)
server.compression.level=6

# Configuração para garantir que seja reconhecida como aplicação web
spring.main.web-application-type=servlet

# Configuração de logging
logging.level.com.inventario.controller.mobile=DEBUG
logging.level.org.springframework.web=INFO

# Configuração de segurança JWT
jwt.secret=inventario-mobile-secret-key-2024-very-long-secret-for-security-must-be-at-least-256-bits
jwt.expiration=86400
jwt.refresh-expiration=604800

# Configurações da API Mobile
api.mobile.version=v1
api.mobile.base-path=/api/mobile
api.mobile.cors.allowed-origins=*
api.mobile.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
api.mobile.cors.allowed-headers=*
api.mobile.cors.allow-credentials=true
api.mobile.rate-limit.enabled=true
api.mobile.rate-limit.requests-per-minute=100

# Configurações do servidor mobile
mobile.server.version=1.0.0
mobile.server.enabled=true
mobile.server.session-timeout=3600000

# Configuração de upload de arquivos (Spring Boot padrão)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Configuração de banco de dados (PostgreSQL existente)
spring.datasource.url=jdbc:postgresql://localhost:5432/sispatrimonio
spring.datasource.jdbc-url=jdbc:postgresql://localhost:5432/sispatrimonio
spring.datasource.username=postgres
spring.datasource.password=Romulo@2020
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== CONFIGURAÇÕES DE ESCALABILIDADE =====

# Pool de Conexões HikariCP (otimizado para alta concorrência)
spring.datasource.hikari.jdbc-url=jdbc:postgresql://localhost:5432/sispatrimonio
spring.datasource.hikari.username=postgres
spring.datasource.hikari.password=Romulo@2020
spring.datasource.hikari.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=InventarioMobileHikariCP

# Thread Pool do Tomcat (otimizado para múltiplas requisições simultâneas)
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=10000
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000

# Keep-Alive para reutilizar conexões HTTP
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=100

# Configurações de performance do Tomcat
server.tomcat.processor-cache=200
server.tomcat.max-http-header-size=8192

# JPA Configuration (otimizado para performance)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Cache de segundo nível do Hibernate (DESABILITADO - dependências não disponíveis)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
# spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
# spring.jpa.properties.hibernate.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider

# Batch processing para otimizar inserts/updates em massa
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Lazy loading otimizado
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false
spring.jpa.open-in-view=false

# ===== MONITORAMENTO E MÉTRICAS (para escalabilidade) =====
# Actuator endpoints para monitoramento
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.health.redis.enabled=false

# Métricas de performance
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.tomcat=true
management.metrics.enable.hikaricp=true

# Health checks detalhados
management.health.db.enabled=true
management.health.diskspace.enabled=true

# ===== CONFIGURAÇÕES DE RESILIÊNCIA =====
# Timeout de requisições (evita travamentos)
spring.mvc.async.request-timeout=30000

# Graceful shutdown (permite finalizar requisições em andamento)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Application info
info.app.name=Sistema de Inventário - API Mobile
info.app.version=1.2.0
info.app.description=API REST para aplicação mobile do sistema de inventário