# =====================================================
# Configuração API Mobile - v5.0 (ESTABILIDADE)
# PRIORIDADE: INTEGRIDADE DOS DADOS DE COLETA
# =====================================================
# Foco: Estabilidade > Performance
# - Transações seguras com rollback automático
# - Retry em falhas de conexão
# - Validação rigorosa de dados
# - Logs de auditoria para coletas
# =====================================================

server.port=8081
server.address=0.0.0.0
server.servlet.context-path=/inventario

# ===== COMPRESSÃO GZIP (PERFORMANCE) =====
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=512

# ===== LOGGING (DEBUG/INFO PARA DEPURAÇÃO) =====
logging.level.root=INFO
logging.level.com.inventario=DEBUG
logging.level.com.inventario.sihcp.mobile.server.controller=DEBUG
logging.level.com.inventario.sihcp.mobile.server.service=DEBUG

# Frameworks
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.transaction=INFO
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.apache.tomcat=ERROR
logging.level.org.apache.catalina=ERROR

# Arquivo de log MÍNIMO (5MB x 3 dias = 15MB total)
logging.file.name=logs/mobile-server.log
logging.file.max-size=5MB
logging.file.max-history=3
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ===== JWT =====
# NOTA DE SEGURANÇA (segredos via placeholders):
# As chaves `jwt.secret` (abaixo) e `spring.datasource.password` (seção "Banco de Dados")
# NÃO devem conter valores literais neste arquivo versionado. Os valores reais devem vir de:
#   - Variáveis de ambiente (produção): DATASOURCE_PASSWORD e JWT_SECRET
#   - Arquivo `application-mobile-local.properties` (desenvolvimento local, NÃO versionado)
# Use `application-mobile-local.properties.example` como modelo.
# O sufixo `:` no placeholder (ex.: `${JWT_SECRET:}`) faz o Spring injetar string vazia
# quando a variável não estiver definida, permitindo ao `SecretsBootstrap` detectar a falha
# no boot com mensagem clara (valida presença e comprimento mínimo de 32 chars).
jwt.secret=${JWT_SECRET:}
# Access Token: 2 dias (172800 segundos) - Permite uso offline por 2 dias
jwt.expiration=172800
# Refresh Token: 14 dias (1209600 segundos) - Permite renovação por 2 semanas
jwt.refresh-expiration=1209600

# ===== API Mobile =====
api.mobile.version=v1
api.mobile.base-path=/api/mobile
# CORS explícito — sem curingas, consistente com MobileSecurityConfig.corsConfigurationSource()
api.mobile.cors.allowed-origins=http://localhost:8081,https://localhost:8081,http://10.0.2.2:8081,http://192.168.10.107:8081,http://10.14.250.228:8081,http://10.14.250.236:8081,http://10.14.250.238:8081
api.mobile.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
api.mobile.cors.allowed-headers=Authorization,Content-Type,Accept,X-Requested-With
api.mobile.cors.allow-credentials=false
api.mobile.rate-limit.enabled=false

# ===== Servidor Mobile =====
mobile.server.version=4.0.0
mobile.server.enabled=true
mobile.server.session-timeout=1800000

# ===== Upload de Arquivos =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ===== Banco de Dados =====
spring.datasource.url=jdbc:postgresql://localhost:5432/sispatrimonio
spring.datasource.username=postgres
# Ver nota de segurança na seção "JWT" acima: valor vem de variável de ambiente
# (DATASOURCE_PASSWORD) em produção ou de application-mobile-local.properties em dev.
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== HikariCP MÍNIMO PARA BAIXO CONSUMO DE MEMÓRIA =====
# CRÍTICO: Pool reduzido para evitar 1GB por usuário
# Cada conexão consome ~5-10MB de memória
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.pool-name=MobileHikariCP

# TIMEOUTS AJUSTADOS PARA ESTABILIDADE
# connection-timeout: tempo para obter conexão do pool (AUMENTADO para 30s)
spring.datasource.hikari.connection-timeout=30000

# idle-timeout: tempo que conexão ociosa fica no pool (5 min)
spring.datasource.hikari.idle-timeout=300000

# max-lifetime: vida máxima de uma conexão (15 min)
# Deve ser menor que wait_timeout do PostgreSQL (padrão 8h)
spring.datasource.hikari.max-lifetime=900000

# leak-detection: detecta conexões não fechadas (60s)
spring.datasource.hikari.leak-detection-threshold=60000

# validation-timeout: tempo para validar conexão (10s)
spring.datasource.hikari.validation-timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1

# Auto-commit habilitado (Spring gerencia transações via @Transactional)
spring.datasource.hikari.auto-commit=true

# Retry em caso de falha de conexão
spring.datasource.hikari.initialization-fail-timeout=30000

# keepalive-time: envia ping para manter conexão viva (2 min)
# Evita que firewall/NAT feche conexões ociosas
spring.datasource.hikari.keepalive-time=120000

# Propriedades do PostgreSQL
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.data-source-properties.socketTimeout=30

# ===== Tomcat MÍNIMO PARA BAIXO CONSUMO DE MEMÓRIA =====
# CRÍTICO: Threads reduzidas - cada thread consome ~1MB de stack
# 10 threads = 10MB, 20 threads = 20MB
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=20
server.tomcat.accept-count=5

# TIMEOUTS AJUSTADOS PARA REDES MÓVEIS (WiFi/4G instáveis)
# connection-timeout: tempo para estabelecer conexão TCP
server.tomcat.connection-timeout=60000

# keep-alive-timeout: tempo que conexão fica aberta aguardando próxima requisição
# AUMENTADO: 5 minutos (300s) para evitar reconexões frequentes
server.tomcat.keep-alive-timeout=300000

# max-keep-alive-requests: máximo de requisições por conexão keep-alive
# AUMENTADO: 200 requisições antes de forçar nova conexão
server.tomcat.max-keep-alive-requests=200

# Buffer de resposta
server.tomcat.max-http-form-post-size=5MB
server.tomcat.max-swallow-size=5MB

# Accesslog DESABILITADO para economizar I/O de disco
# MUDANÇA: Desabilitado (economiza ~30% de I/O)
server.tomcat.accesslog.enabled=false

# ===== TRATAMENTO DE CANCELAMENTO DE CONEXÃO =====
# Quando o cliente cancela uma operação longa, o servidor trata graciosamente
# sem gerar erros no log (ClientAbortException, Broken pipe, etc.)

# Timeout de resposta assíncrona (5 minutos para operações longas)
spring.mvc.async.request-timeout=300000

# Não incluir detalhes de erro na resposta (segurança)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# ===== JPA CONFIGURADO PARA INTEGRIDADE DE DADOS =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Cache desabilitado para garantir dados sempre atualizados
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Batch para operações em lote (coletas)
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Fetch size conservador
spring.jpa.properties.hibernate.jdbc.fetch_size=30

# CRÍTICO: Desabilitar open-in-view
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# Estatísticas desabilitadas
spring.jpa.properties.hibernate.generate_statistics=false

# CRÍTICO: Configurações de transação para integridade
spring.jpa.properties.hibernate.connection.isolation=2
spring.jpa.properties.hibernate.connection.autocommit=false

# ===== ACTUATOR MÍNIMO PARA BAIXO CONSUMO =====
# CRÍTICO: Métricas consomem memória - desabilitar a maioria
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.metrics.enabled=false
management.health.db.enabled=false
management.health.diskspace.enabled=false

# Métricas DESABILITADAS para economizar memória
management.metrics.enable.jvm=false
management.metrics.enable.process=false
management.metrics.enable.tomcat=false
management.metrics.enable.hikaricp=false

# ===== RESILIÊNCIA PARA REDES MÓVEIS =====
# Request timeout: 60s (coleta ~10s + margem para rede instável)
spring.mvc.async.request-timeout=60000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Timeout de transação: 60s (margem para operações lentas)
spring.transaction.default-timeout=60

# ===== JACKSON (JSON) =====
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== CACHE HTTP =====
spring.web.resources.cache.cachecontrol.max-age=60
spring.web.resources.cache.cachecontrol.cache-public=true

# ===== TRANSAÇÕES =====
# Timeout: 30s (coleta individual ~10s + margem de segurança)
spring.transaction.default-timeout=30

# ===== VALIDAÇÃO =====
spring.mvc.throw-exception-if-no-handler-found=true

# ===== INFO =====
info.app.name=Sistema de Inventário - API Mobile
info.app.version=5.1.0
info.app.description=API REST Mobile (Prioridade: Baixo Consumo de Memória)
info.app.low-memory-mode=true

# ===== OTIMIZAÇÕES EXTRAS PARA BAIXO CONSUMO =====
# Desabilitar recursos não essenciais
spring.main.banner-mode=off
spring.output.ansi.enabled=never
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Desabilitar auto-configurações desnecessárias
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.admin.SpringApplicationAdminJmxAutoConfiguration,\
  org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration,\
  org.springframework.boot.autoconfigure.websocket.servlet.WebSocketServletAutoConfiguration

# Limitar tamanho de resposta para evitar OOM
spring.codec.max-in-memory-size=256KB

# Desabilitar cache de templates (não usamos)
spring.thymeleaf.cache=false
spring.freemarker.cache=false
