# =====================================================
# Configuração para DEPLOY EXTERNO - Servidor Mobile
# Usa variáveis de ambiente ou arquivo externo
# =====================================================

server.port=8081
server.address=0.0.0.0
server.servlet.context-path=/inventario

# ===== COMPRESSÃO =====
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# ===== LOGGING =====
logging.level.root=WARN
logging.level.com.inventario=INFO
logging.file.name=logs/mobile-server.log
logging.file.max-size=5MB

# ===== JWT =====
jwt.secret=inventario-mobile-secret-key-2024-very-long-secret-for-security-must-be-at-least-256-bits
jwt.expiration=86400
jwt.refresh-expiration=604800

# =====================================================
# BANCO DE DADOS - CONFIGURÁVEL VIA VARIÁVEIS DE AMBIENTE
# =====================================================
# Se não definir variáveis, usa os valores padrão abaixo
# Para customizar, defina as variáveis antes de iniciar:
#   set DB_HOST=192.168.1.100
#   set DB_PORT=5432
#   set DB_NAME=sispatrimonio
#   set DB_USER=postgres
#   set DB_PASSWORD=suasenha

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sispatrimonio}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== HikariCP =====
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

# ===== TOMCAT =====
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=3
server.tomcat.connection-timeout=15000

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== ACTUATOR =====
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
