# =====================================================
# Configuração ROBUSTA E ESTÁVEL - Servidor Mobile
# Funciona bem em máquinas modestas (4GB RAM, 2 cores)
# Prioriza ESTABILIDADE sobre performance máxima
# =====================================================

server.port=8081
server.address=0.0.0.0
server.servlet.context-path=/inventario

# ===== COMPRESSÃO =====
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1024

# ===== LOGGING BALANCEADO =====
# Logs suficientes para debug, mas não excessivos
logging.level.root=WARN
logging.level.com.inventario=INFO
logging.level.com.inventario.mobile.server.controller=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN

logging.file.name=logs/mobile-server.log
logging.file.max-size=5MB
logging.file.max-history=5
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{20} - %msg%n

# ===== JWT =====
jwt.secret=inventario-mobile-secret-key-2024-very-long-secret-for-security-must-be-at-least-256-bits
jwt.expiration=86400
jwt.refresh-expiration=604800

# ===== BANCO DE DADOS =====
spring.datasource.url=jdbc:postgresql://localhost:5432/sispatrimonio
spring.datasource.username=postgres
spring.datasource.password=Romulo@2020
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# HikariCP ROBUSTO - Chave para estabilidade!
# =====================================================
# Pool generoso mas controlado
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3

# CRÍTICO: Timeouts que evitam travamentos
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000

# Detectar conexões vazadas (muito importante!)
spring.datasource.hikari.leak-detection-threshold=60000

# Validar conexões antes de usar
spring.datasource.hikari.connection-test-query=SELECT 1

spring.datasource.hikari.pool-name=RobustoHikariCP

# =====================================================
# TOMCAT ROBUSTO
# =====================================================
# Threads suficientes para 20-30 usuários simultâneos
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

# Conexões generosas
server.tomcat.max-connections=200
server.tomcat.accept-count=50

# Timeouts razoáveis (não muito curtos!)
server.tomcat.connection-timeout=20000
server.tomcat.keep-alive-timeout=30000
server.tomcat.max-keep-alive-requests=100

# =====================================================
# JPA/HIBERNATE ROBUSTO
# =====================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# CRÍTICO: Desabilitar open-in-view (causa vazamento de conexões!)
spring.jpa.open-in-view=false

# Cache de segundo nível DESABILITADO (simplifica)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Batch para melhor performance
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =====================================================
# RESILIÊNCIA E RECUPERAÇÃO
# =====================================================
# Shutdown gracioso
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Timeout de requisições async
spring.mvc.async.request-timeout=60000

# =====================================================
# ACTUATOR PARA MONITORAMENTO
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Health checks
management.health.db.enabled=true
management.health.diskspace.enabled=true

# ===== JACKSON =====
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ===== UPLOAD =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===== INFO =====
info.app.name=Sistema de Inventário - API Mobile
info.app.version=3.0.0
info.app.description=API REST Mobile (Configuração Robusta)
