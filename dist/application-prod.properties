# Configuração de Produção - Sistema de Inventário
# Arquivo: application-prod.properties

# ========================================
# CONFIGURAÇÕES DO SERVIDOR
# ========================================
server.port=8080
server.address=0.0.0.0

# ========================================
# CONFIGURAÇÕES DE LOGGING
# ========================================
logging.level.root=INFO
logging.level.com.inventario=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Arquivo de log
logging.file.name=logs/sistema-inventario-prod.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ========================================
# CONFIGURAÇÕES DO BANCO DE DADOS
# ========================================
# Nota: As configurações do banco são carregadas do arquivo configuracao_banco.json
# localizado no diretório home do usuário

# Pool de conexões
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ========================================
# CONFIGURAÇÕES JPA/HIBERNATE
# ========================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ========================================
# CONFIGURAÇÕES DE SEGURANÇA
# ========================================
# JWT
jwt.secret=${JWT_SECRET:SistemaInventarioSecretKey2024!@#$%}
jwt.expiration=86400000

# ========================================
# CONFIGURAÇÕES DA API MOBILE
# ========================================
mobile.api.enabled=true
mobile.api.max-requests-per-minute=100
mobile.api.session-timeout=3600

# ========================================
# CONFIGURAÇÕES DE PERFORMANCE
# ========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Cuiaba

# ========================================
# CONFIGURAÇÕES DE ERRO
# ========================================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ========================================
# CONFIGURAÇÕES DE COMPRESSÃO
# ========================================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ========================================
# CONFIGURAÇÕES DE CACHE
# ========================================
spring.cache.type=simple

# ========================================
# CONFIGURAÇÕES DE THREAD POOL
# ========================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# ========================================
# DESABILITAR RECURSOS DE DESENVOLVIMENTO
# ========================================
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
debug=false
