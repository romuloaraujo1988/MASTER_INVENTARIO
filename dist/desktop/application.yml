# Configuração do Sistema de Inventário
spring:
  application:
    name: sistema-inventario
  
  # Desabilitar JMX completamente
  jmx:
    enabled: false
  
  # Configuração do Banco de Dados PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/sispatrimonio
    username: postgres
    password: Romulo@2020
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
  
  # Configuração JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  # Configuração do Thymeleaf
  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html
  
  # Configuração de Recursos Estáticos
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 3600
  
  # Configuração de Segurança
  security:
    user:
      name: admin
      password: admin123
      roles: ADMIN
  
  # Configuração de Upload de Arquivos (Multipart)
  servlet:
    multipart:
      enabled: true
      max-file-size: 10485760
      max-request-size: 10485760
      file-size-threshold: 0

# Configurações do Servidor
server:
  # Porta padrão (será sobrescrita pelo perfil mobile para 8081)
  # COMENTADO: port: 8080
  servlet:
    context-path: /inventario
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    whitelabel:
      enabled: false
    path: /error

# Configurações de Logging
logging:
  level:
    com.inventario: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/sistema-inventario.log
    max-size: 10485760
    max-history: 30

# Configurações da Aplicação
app:
  name: Sistema de Inventário
  version: 1.0.0
  description: Sistema de Controle de Inventário de Patrimônio
  
  # Configurações de Sessão
  session:
    timeout: 30m
    
  # Configurações de Upload
  upload:
    max-file-size: 10485760
    max-request-size: 52428800
    temp-dir: temp/uploads
    
  # Configurações de Relatórios
  reports:
    output-dir: reports
    temp-dir: temp/reports
    
  # Configurações de Backup
  backup:
    enabled: true
    schedule: "0 0 2 * * ?"
    retention-days: 30

# Configurações JWT para API Mobile
jwt:
  secret: inventario-mobile-secret-key-2024-very-long-secret-for-security-must-be-at-least-256-bits
  expiration: 86400 # 24 horas em segundos
  refresh-expiration: 604800 # 7 dias em segundos
  
# Configurações da API Mobile
api:
  mobile:
    version: v1
    base-path: /api/mobile
    cors:
      allowed-origins: "*"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true
    rate-limit:
      enabled: true
      requests-per-minute: 100

# Configurações de Documentação (Swagger/OpenAPI)
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: true

# Configurações de Monitoramento
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  # Desabilitar JMX para evitar erros de conectividade
  jmx:
    enabled: false

---
# Perfil de Desenvolvimento
spring:
  config:
    activate:
      on-profile: dev
  
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

logging:
  level:
    root: INFO
    com.inventario: DEBUG

---
# Perfil de Produção
spring:
  config:
    activate:
      on-profile: prod
  
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    com.inventario: INFO

# COMENTADO: Porta será definida pelo perfil mobile
# server:
#   port: 8080
  
app:
  backup:
    enabled: true
    schedule: "0 0 2 * * ?"