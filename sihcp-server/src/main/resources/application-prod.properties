# =====================================================
# Perfil de Produção — SIHCP Mobile API
# =====================================================
# Ativar com: --spring.profiles.active=mobile,prod
# ou SPRING_PROFILES_ACTIVE=mobile,prod
#
# Este arquivo SOBRESCREVE valores de application-mobile.properties
# quando o perfil prod está ativo.
# =====================================================

# ===== Logs sanitizados (nunca DEBUG em produção) =====
logging.level.root=WARN
logging.level.com.inventario=INFO
logging.level.com.inventario.sihcp=INFO
logging.level.com.inventario.sihcp.mobile.server.controller=INFO
logging.level.com.inventario.sihcp.mobile.server.service=INFO
logging.level.com.inventario.sihcp.security=INFO
logging.level.org.springframework.security=WARN

# ===== Rate limit habilitado em produção =====
api.mobile.rate-limit.enabled=true

# ===== JWT curto em produção (1h access, 7 dias refresh) =====
# Valores sobreescritos via env var para flexibilidade
jwt.expiration=${JWT_EXPIRATION:3600}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800}

# ===== CORS em produção (sobrescritível via env) =====
api.mobile.cors.allowed-origins=${API_MOBILE_CORS_ALLOWED_ORIGINS:http://localhost:8081}
api.mobile.cors.allow-credentials=false
