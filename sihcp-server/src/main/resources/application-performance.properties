# ========================================
# CONFIGURAÇÕES DE ALTA PERFORMANCE
# Sistema de Inventário - Otimizações
# ========================================

# ========================================
# SERVIDOR - OTIMIZAÇÕES TOMCAT
# ========================================
server.port=8080
server.address=0.0.0.0

# Thread Pool Otimizado
server.tomcat.threads.min-spare=20
server.tomcat.threads.max=200
server.tomcat.max-connections=10000
server.tomcat.accept-count=100

# Connection Timeout
server.tomcat.connection-timeout=20000
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=100

# Compressão Agressiva
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=512

# ========================================
# HIKARICP - POOL DE CONEXÕES OTIMIZADO
# ========================================
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# Otimizações de Performance
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# ========================================
# JPA/HIBERNATE - OTIMIZAÇÕES
# ========================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Batch Processing
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Query Optimization
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# Second Level Cache (Caffeine)
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.hibernate.javax.cache.provider=com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider

# Statistics (desabilitar em produção)
spring.jpa.properties.hibernate.generate_statistics=false

# ========================================
# JACKSON - SERIALIZAÇÃO OTIMIZADA
# ========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Cuiaba
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=false

# ========================================
# CACHE - CAFFEINE (ALTA PERFORMANCE)
# ========================================
spring.cache.type=caffeine
spring.cache.cache-names=patrimonios,salas,responsaveis,descricoes,inventarios,coletas
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=30m,recordStats

# ========================================
# LOGGING - MÍNIMO EM PRODUÇÃO
# ========================================
logging.level.root=WARN
logging.level.com.inventario.sihcp=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN

# Async Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ========================================
# THREAD POOL - ASYNC PROCESSING
# ========================================
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=async-

# ========================================
# ACTUATOR - MÉTRICAS
# ========================================
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ========================================
# JWT - OTIMIZAÇÕES
# ========================================
jwt.secret=${JWT_SECRET:SistemaInventarioSecretKey2024!@#$%}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ========================================
# MOBILE API - RATE LIMITING
# ========================================
mobile.api.enabled=true
mobile.api.max-requests-per-minute=200
mobile.api.session-timeout=3600

# ========================================
# DESABILITAR RECURSOS DESNECESSÁRIOS
# ========================================
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.jmx.enabled=false
debug=false

# ========================================
# OTIMIZAÇÕES DE SEGURANÇA
# ========================================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
