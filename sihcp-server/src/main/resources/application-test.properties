# Configurações para teste com SQLite em memória
spring.datasource.url=jdbc:sqlite::memory:
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.password=test-password
spring.jpa.database-platform=org.hibernate.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Configurações do servidor
server.port=8080
spring.application.name=inventario-api-test

# Configurações de segurança simplificadas para teste
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

# JWT secret para teste (32+ chars — satisfaz SecretsBootstrap)
# spec correcoes-seguranca Req 1.6: validação de comprimento mínimo
jwt.secret=test-jwt-secret-with-at-least-32-characters-for-bootstrap-validation
jwt.expiration=3600
jwt.refresh-expiration=86400

# Logs
logging.level.com.inventario.sihcp=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.root=WARN