events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Configurações básicas
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Compressão (adicional à do Spring Boot)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    
    # Upstream - Backend servers
    upstream inventario_backend {
        least_conn;  # Distribui para servidor com menos conexões
        
        # Health check passivo
        server mobile-api:8081 max_fails=3 fail_timeout=30s;
        
        # Adicionar mais instâncias conforme necessário
        # server mobile-api-2:8081 max_fails=3 fail_timeout=30s;
        # server mobile-api-3:8081 max_fails=3 fail_timeout=30s;
        
        # Keep-alive para reutilizar conexões
        keepalive 32;
    }
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_status 429;
    
    # Server block
    server {
        listen 80;
        server_name localhost;
        
        # Tamanho máximo de upload
        client_max_body_size 10M;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Health check endpoint (para load balancer externo)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # API Mobile
        location /inventario/ {
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;
            
            # Proxy para backend
            proxy_pass http://inventario_backend;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (se necessário)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Cache de respostas estáticas (se houver)
            proxy_cache_bypass $http_upgrade;
        }
        
        # Métricas (protegido - apenas localhost)
        location /metrics {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://inventario_backend/inventario/actuator/prometheus;
        }
        
        # Status do Nginx
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}
