# Configurações específicas do NetBeans para o projeto Spring Boot
# Este arquivo configura o NetBeans para reconhecer e executar corretamente o servidor mobile

# Configurações do Spring Boot
spring.boot.version=3.2.0
spring.boot.main.class=com.inventario.MobileApiApplication
spring.profiles.active=mobile

# Configurações de execução
run.jvmargs=-Dspring.profiles.active=mobile -Dserver.port=8081 -Dspring.main.class=com.inventario.MobileApiApplication
debug.jvmargs=-Dspring.profiles.active=mobile -Dserver.port=8081 -Dspring.main.class=com.inventario.MobileApiApplication -Xdebug -Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=5005

# Configurações do Maven
maven.goals=clean compile spring-boot:run
maven.profiles=mobile

# Configurações de encoding
project.build.sourceEncoding=UTF-8
project.reporting.outputEncoding=UTF-8

# Configurações do Java
java.version=21
java.source.version=21
java.target.version=21

# Configurações de servidor
server.port=8081
server.address=0.0.0.0
server.servlet.context-path=/inventario

# Configurações de desenvolvimento
compile.on.save=false
do.depend=false
do.jar=true
javac.debug=true
javac.deprecation=false
javac.processorpath=${javac.classpath}
javac.test.processorpath=${javac.test.classpath}

# Configurações de teste
test.src.dir=src/test/java
test.test.dir=src/test/java